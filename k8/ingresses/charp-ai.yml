
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whilter-charpai-frontend
  namespace: dev-charp
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:390844737706:certificate/92f277fb-9beb-48d7-810a-ac6bccffdb69
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: charp-ai.whilter.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: charpai-frontend-service
                port:
                  number: 80
  tls:
    - hosts:
        - charp-ai.whilter.ai

