name: s3-depl

on:
  push:
    branches:
      - user-management

jobs:
  # Detect which apps changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      charp-ai: ${{ steps.filter.outputs.charp-ai }}
      media-tools: ${{ steps.filter.outputs.media-tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed apps
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            main:
              - 'apps/main/**'
            charp-ai:
              - 'apps/charp-ai/**'
            media-tools:
              - 'apps/media-tools/**'

  # Deploy Admin
  deploy-main:
    needs: changes
    if: needs.changes.outputs.main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WHILTER_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.WHILTER_SECRET_KEY }}
          aws-region: ${{ secrets.WHILTER_BUCKET_REGION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (main)
        run: pnpm --filter main build

      - name: Deploy to S3 (main)
        run: aws s3 sync apps/main/out/ s3://platform.whilter.ai/main --delete
